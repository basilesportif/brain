# Replace all ca_XXXX values with your own Composio connected account IDs.
# Find them at: https://app.composio.dev/connected_accounts
accounts:
  google_calendar:
    id: ca_XXXX                     # Google Calendar connected account
    email: you@gmail.com
  gmail:
    - id: ca_XXXX
      email: you@gmail.com
    - id: ca_XXXX
      email: you@work.com

calendars:
  # Add named aliases for your calendars (optional). Real calendar ids stay private.
  # football: "<google-calendar-id>@group.calendar.google.com"

# Optional Gmail query excludes for private sender-specific noise filters.
# Prefer workspace .env ASSISTANT_GMAIL_QUERY_EXCLUDES for secret/private values.
gmail_query_excludes: []
