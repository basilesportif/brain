runtime:
  activeEntrypointMode: single-primary

workspaces:
  personal:
    workspacePath: /home/brain/.brain/workspace
    provider: codex
    primaryEntrypointId: telegram-main
    enabledEntrypoints:
      telegram-main:
        kind: telegram
        enabled: true
        displayName: Personal Telegram
        configRef: env:TELEGRAM_MAIN_CONFIG
        capabilities:
          replies: true
          edits: true
          artifactUploads: true
          statusUpdates: true
      web-preview:
        kind: web
        enabled: false
        displayName: Web preview
        configRef: env:WEB_PREVIEW_CONFIG
    outboundDefaults:
      route: originating-entrypoint
      allowCrossEntrypointReplies: false
    promptContext:
      includeActiveEntrypointMetadata: true
      exposeChannelSecrets: false
    backup:
      strategy: private-git
      privateGit:
        repoPath: /home/brain/.brain/workspace/backups/private-git
        remote: git@github.com:example/private-brain-backup.git
        branch: main
        include:
          - config/**
          - state/**
          - data/**
          - instructions/**
          - tasks/**
          - projects/**
          - notes/**
          - documents/metadata/**
          - private/documents/metadata.jsonl
          - artifacts/metadata/**
          - .claude/repo-registry/index.yaml
          - .claude/repo-registry/config.yaml
          - .claude/repo-registry/repos/**/state.yaml
          - .claude/repo-registry/repos/**/guidance.md
          - .claude/repo-registry/repos/**/guidance.json
          - .claude/repo-registry/repos/**/notes.md
        exclude:
          - secrets/**
          - logs/**
          - tmp/**
          - cache/**
          - caches/**
          - state/setup-progress.json
          - private/documents/files/**
          - .claude/repo-registry/runtime/node_modules/**
          - .claude/repo-registry/runtime/dist/**
          - .claude/repo-registry/runtime/.turbo/**
          - "**/.cache/**"
          - "**/node_modules/**"
          - "**/*.log"
    webPublishing:
      enabled: false
      mode: disabled
      domain: me.example.test
      baseUrl: https://me.example.test/pages
      publishRoot: /home/brain/.brain/pages
      reverseProxy:
        kind: caddy
        note: Configure Caddy/reverse proxy after operator confirmation; brainctl never changes DNS.
    transcription:
      enabled: false
      provider: openai
      apiKeyRef: env:OPENAI_API_KEY
      model: gpt-4o-mini-transcribe
      scope:
        entrypointIds:
          - telegram-main
        attachmentKinds:
          - voice
          - audio
    integrations:
      composio:
        enabled: false
        apiKeyRef: env:COMPOSIO_API_KEY
        connectedAccountRef: file:/home/brain/.brain/workspace/config/composio-connected-account.json
        dataSources:
          googleCalendar:
            enabled: false
            connectedAccountRef: file:/home/brain/.brain/workspace/config/google-calendar-connected-account.json
            requiredEnvRefs:
              - env:COMPOSIO_API_KEY
          chat:
            enabled: false
            connectedAccountRef: file:/home/brain/.brain/workspace/config/chat-connected-account.json
            requiredEnvRefs:
              - env:COMPOSIO_API_KEY
